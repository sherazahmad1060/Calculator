<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    .specular-border {
      border: 1px solid transparent;
      background-clip: padding-box, border-box;
      background-origin: padding-box, border-box;
      background-image: 
        linear-gradient(to bottom, #574a2e9f, #383432),
        linear-gradient(180deg, rgba(255, 255, 255, 0.4) 0%, rgba(245, 158, 11, 0.2) 60%, rgba(255, 255, 255, 0.05) 100%);
    }
    .specular-display-border {
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4), inset 0 -1px 1px rgba(255, 255, 255, 0.15);
    }
    .key-tactile {
      transition: transform 90ms cubic-bezier(0.4, 0, 0.2, 1), background-color 150ms ease, box-shadow 150ms ease, filter 100ms ease;
      touch-action: manipulation;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .key-tactile:active, .key-tactile.key-pressed {
      transform: scale(0.92);
      filter: brightness(1.25);
    }

    /* Ambient breathing aura behind glass card */
    @keyframes ambient-glow {
      0%, 100% {
        transform: scale(1) translate(0px, 0px) rotate(0deg);
        opacity: 0.55;
      }
      33% {
        transform: scale(1.08) translate(12px, -8px) rotate(3deg);
        opacity: 0.75;
      }
      66% {
        transform: scale(0.96) translate(-10px, 10px) rotate(-3deg);
        opacity: 0.6;
      }
    }
    .ambient-aura {
      animation: ambient-glow 14s ease-in-out infinite alternate;
      background: radial-gradient(circle at 50% 40%, rgba(245, 158, 11, 0.45) 0%, rgba(255, 115, 0, 0.25) 35%, rgba(139, 92, 246, 0.22) 70%, transparent 100%);
      filter: blur(48px);
    }

    /* Number pulse animation when evaluated */
    @keyframes result-pop {
      0% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: result-pop 180ms cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* Sound wave ripple animations */
    @keyframes wave-ping {
      0% { transform: scale(0.8); opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    .animate-wave-ping {
      animation: wave-ping 0.6s cubic-bezier(0, 0, 0.2, 1) forwards;
    }

    /* Custom scrollbar for history drawer */
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 193, 116, 0.25);
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 193, 116, 0.45);
    }
  </style>

<h2 class="text-base font-semibold text-text-primary tracking-wide">Calculation History</h2>
<span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/20 text-primary border border-amber-500/30" id="history-count-badge">3</span>
</div>
<div class="flex items-center gap-2">
<button class="p-1.5 rounded-full text-text-secondary hover:text-error hover:bg-error-container/30 transition-colors" id="clear-history-btn" title="Clear all history" type="button">
<span class="material-symbols-outlined text-[20px]">delete_sweep</span>
</button>
<button class="p-1.5 rounded-full text-text-secondary hover:text-text-primary hover:bg-white/10 transition-colors" id="close-history-btn" title="Close drawer" type="button">
<span class="material-symbols-outlined text-[22px]">close</span>
</button>
</div>
</div>
<!-- History Items List Container -->
<div class="px-4 py-3 flex-1 overflow-y-auto custom-scrollbar flex flex-col gap-2.5 max-h-[50vh]" id="history-list-items">
<!-- Populated dynamically via JS -->
</div>
<!-- Drawer Footer Tip -->
<div class="p-3 bg-surface-container-lowest/60 text-center text-xs text-text-secondary/70 border-t border-white/5 rounded-b-[2.5rem] flex items-center justify-center gap-1.5">
<span class="material-symbols-outlined text-[15px] text-amber-400">touch_app</span>
<span>Tap <strong>Use</strong> to load calculation result into current keypad</span>
</div>
</div>
</div>
</div>
<script>
  (function () {
    // -------------------------------------------------------------------------
    // 1. Audio & Haptic Feedback Engine via Web Audio API
    // -------------------------------------------------------------------------
    let audioCtx = null;
    let soundEnabled = true;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type = 'sine', gainVal = 0.15, pitchDecay = true) {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (pitchDecay) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(40, freq * 0.4), now + duration);
        }

        gain.gain.setValueAtTime(gainVal, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function playHapticSound(kind) {
      // Hardware vibration if supported
      if (window.navigator && window.navigator.vibrate) {
        try {
          if (kind === 'equals') window.navigator.vibrate([14, 30, 20]);
          else if (kind === 'clear') window.navigator.vibrate([10, 25, 10]);
          else window.navigator.vibrate(8);
        } catch (_) {}
      }

      // Synthesized Audio feedback
      if (!soundEnabled) return;

      if (kind === 'number') {
        // High crisp tactile micro-click
        playTone(1050, 0.038, 'triangle', 0.18, true);
      } else if (kind === 'operator' || kind === 'backspace') {
        // Warm resonant tactile tap
        playTone(520, 0.055, 'sine', 0.22, true);
      } else if (kind === 'equals') {
        // Harmonious confirmation chord (523Hz C5 + 659Hz E5)
        playTone(523.25, 0.24, 'sine', 0.2, false);
        setTimeout(() => {
          playTone(659.25, 0.28, 'sine', 0.24, false);
        }, 35);
      } else if (kind === 'clear') {
        // Dismissive double-tick
        playTone(380, 0.04, 'triangle', 0.2, true);
        setTimeout(() => {
          playTone(280, 0.045, 'triangle', 0.18, true);
        }, 55);
      } else if (kind === 'toggle-on') {
        playTone(587.33, 0.08, 'sine', 0.16, false);
        setTimeout(() => playTone(880, 0.12, 'sine', 0.2, false), 50);
      } else if (kind === 'toggle-off') {
        playTone(620, 0.07, 'sine', 0.16, false);
        setTimeout(() => playTone(311.13, 0.1, 'sine', 0.16, false), 50);
      }
    }

    // Toggle Sound Button Realistic UI
    const soundToggleBtn = document.getElementById('sound-toggle-btn');
    const soundIcon = document.getElementById('sound-icon');
    const soundDot = document.getElementById('sound-dot');
    const soundStateText = document.getElementById('sound-state-text');

    if (soundToggleBtn && soundIcon) {
      soundToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        soundEnabled = !soundEnabled;

        if (soundEnabled) {
          playHapticSound('toggle-on');
          soundIcon.textContent = 'volume_up';
          soundIcon.className = 'material-symbols-outlined text-[19px] text-primary transition-all duration-200 group-hover:scale-110';
          soundDot.className = 'w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399] transition-all duration-300';
          soundStateText.textContent = 'ON';
          soundStateText.className = 'text-[11px] font-semibold tracking-wider uppercase text-amber-300 font-label-sm';
          soundToggleBtn.classList.remove('border-stone-700', 'bg-stone-900/40');
          soundToggleBtn.classList.add('border-amber-500/25', 'bg-stone-900/60');
        } else {
          playTone(400, 0.05, 'triangle', 0.12, true); // Play brief tone before silent
          soundIcon.textContent = 'volume_off';
          soundIcon.className = 'material-symbols-outlined text-[19px] text-stone-500 transition-all duration-200';
          soundDot.className = 'w-2 h-2 rounded-full bg-stone-600 shadow-none transition-all duration-300';
          soundStateText.textContent = 'OFF';
          soundStateText.className = 'text-[11px] font-semibold tracking-wider uppercase text-stone-500 font-label-sm';
          soundToggleBtn.classList.remove('border-amber-500/25', 'bg-stone-900/60');
          soundToggleBtn.classList.add('border-stone-700', 'bg-stone-900/40');
        }
      });
    }

    // -------------------------------------------------------------------------
    // 2. Interactive Calculation History Bottom Sheet Drawer
    // -------------------------------------------------------------------------
    let historyData = [
      { equation: "666,286 × 66 =", result: "555,555,555", time: "Just now" },
      { equation: "1,450 × 8.5 =", result: "12,325", time: "5m ago" },
      { equation: "320 + 48 − 45 =", result: "323", time: "12m ago" }
    ];

    const historyBtn = document.getElementById('history-btn');
    const historySheetContainer = document.getElementById('history-sheet-container');
    const historyScrim = document.getElementById('history-scrim');
    const historySheet = document.getElementById('history-sheet');
    const closeHistoryBtn = document.getElementById('close-history-btn');
    const clearHistoryBtn = document.getElementById('clear-history-btn');
    const historyListItems = document.getElementById('history-list-items');
    const historyCountBadge = document.getElementById('history-count-badge');
    const historyIndicator = document.getElementById('history-indicator');

    function renderHistory() {
      historyCountBadge.textContent = historyData.length;
      if (historyData.length === 0) {
        historyIndicator.classList.add('hidden');
        historyListItems.innerHTML = `
          <div class="py-10 flex flex-col items-center justify-center text-center text-text-secondary/60">
            <span class="material-symbols-outlined text-4xl mb-2 text-stone-600">history_toggle_off</span>
            <p class="text-sm font-medium">No calculation history</p>
            <p class="text-xs text-stone-500">Calculations will appear here automatically</p>
          </div>
        `;
        return;
      }

      historyIndicator.classList.remove('hidden');
      historyListItems.innerHTML = historyData.map((item, index) => `
        <div class="group/item flex items-center justify-between p-3 rounded-xl bg-white/5 hover:bg-white/10 border border-white/5 hover:border-amber-500/30 transition-all duration-200">
          <div class="flex flex-col text-left overflow-hidden pr-2">
            <span class="text-xs text-text-secondary/70 font-mono tracking-wide truncate">${item.equation}</span>
            <span class="text-lg font-medium text-amber-200 font-headline-sm truncate tracking-tight">${item.result}</span>
            <span class="text-[10px] text-stone-400 mt-0.5">${item.time}</span>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button data-use-index="${index}" class="use-history-btn px-2.5 py-1 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 text-xs font-medium flex items-center gap-1 active:scale-95 transition-all" title="Load into display">
              <span class="material-symbols-outlined text-[14px]">reply</span>
              <span>Use</span>
            </button>
            <button data-del-index="${index}" class="delete-history-btn p-1 rounded-lg text-stone-500 hover:text-red-400 hover:bg-red-500/10 active:scale-95 transition-colors" title="Delete record">
              <span class="material-symbols-outlined text-[16px]">close</span>
            </button>
          </div>
        </div>
      `).join('');

      // Add event listeners for dynamic item buttons
      historyListItems.querySelectorAll('.use-history-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.getAttribute('data-use-index'), 10);
          if (historyData[idx]) {
            currentInput = historyData[idx].result.replace(/,/g, '');
            equation = historyData[idx].equation;
            resetOnNextNumber = true;
            updateDisplay(true);
            playHapticSound('number');
            closeHistorySheet();
          }
        });
      });

      historyListItems.querySelectorAll('.delete-history-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const idx = parseInt(btn.getAttribute('data-del-index'), 10);
          historyData.splice(idx, 1);
          renderHistory();
          playHapticSound('backspace');
        });
      });
    }

    function openHistorySheet() {
      playTone(450, 0.05, 'sine', 0.14, false);
      historySheetContainer.classList.remove('pointer-events-none');
      historyScrim.classList.remove('pointer-events-none', 'opacity-0');
      historyScrim.classList.add('opacity-100');
      historySheet.classList.remove('translate-y-full');
      renderHistory();
    }

    function closeHistorySheet() {
      historySheetContainer.classList.add('pointer-events-none');
      historyScrim.classList.add('opacity-0', 'pointer-events-none');
      historyScrim.classList.remove('opacity-100');
      historySheet.classList.add('translate-y-full');
    }

    if (historyBtn) historyBtn.addEventListener('click', openHistorySheet);
    if (closeHistoryBtn) closeHistoryBtn.addEventListener('click', closeHistorySheet);
    if (historyScrim) historyScrim.addEventListener('click', closeHistorySheet);

    if (clearHistoryBtn) {
      clearHistoryBtn.addEventListener('click', () => {
        if (historyData.length > 0) {
          playHapticSound('clear');
          historyData = [];
          renderHistory();
        }
      });
    }

    // -------------------------------------------------------------------------
    // 3. Interactive Calculator State & Evaluation Logic
    // -------------------------------------------------------------------------
    const mainDisplay = document.getElementById('main-display');
    const eqDisplay = document.getElementById('equation-display');

    let currentInput = "555555555";
    let equation = "666,286 × 66 =";
    let resetOnNextNumber = true;

    function formatNumberString(numStr) {
      if (numStr === 'Error' || numStr === 'Infinity' || numStr === '-Infinity') return 'Error';
      if (numStr.endsWith('.')) {
        const parts = numStr.split('.');
        const formattedInt = Number(parts[0]).toLocaleString('en-US');
        return formattedInt + '.';
      }
      if (numStr.includes('.')) {
        const [intPart, decPart] = numStr.split('.');
        const formattedInt = Number(intPart || 0).toLocaleString('en-US');
        return `${formattedInt}.${decPart}`;
      }
      const num = Number(numStr);
      if (isNaN(num)) return numStr;
      return num.toLocaleString('en-US', { maximumFractionDigits: 8 });
    }

    function updateDisplay(popEffect = false) {
      mainDisplay.textContent = formatNumberString(currentInput);
      eqDisplay.textContent = equation;

      // Dynamic text sizing for large numbers
      const len = mainDisplay.textContent.length;
      if (len > 12) {
        mainDisplay.className = "w-full text-text-primary font-display-md text-display-md font-light tracking-tight truncate drop-shadow-[0_2px_8px_rgba(0,0,0,0.4)]";
      } else if (len > 8) {
        mainDisplay.className = "w-full text-text-primary font-display-md-mobile text-display-md-mobile md:text-display-md font-light tracking-tight truncate drop-shadow-[0_2px_8px_rgba(0,0,0,0.4)]";
      } else {
        mainDisplay.className = "w-full text-text-primary font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg font-light tracking-tight truncate drop-shadow-[0_2px_8px_rgba(0,0,0,0.4)]";
      }

      if (popEffect) {
        mainDisplay.classList.remove('animate-pop');
        void mainDisplay.offsetWidth; // Reflow
        mainDisplay.classList.add('animate-pop');
      }
    }

    function inputDigit(digit) {
      playHapticSound('number');
      if (currentInput === 'Error' || resetOnNextNumber) {
        currentInput = digit === '00' ? '0' : digit;
        resetOnNextNumber = false;
      } else {
        if (currentInput === '0' && digit !== '00') {
          currentInput = digit;
        } else if (currentInput === '0' && digit === '00') {
          currentInput = '0';
        } else {
          if (currentInput.replace('.', '').length < 15) {
            currentInput += digit;
          }
        }
      }
      updateDisplay();
    }

    function inputDecimal() {
      playHapticSound('number');
      if (currentInput === 'Error' || resetOnNextNumber) {
        currentInput = '0.';
        resetOnNextNumber = false;
      } else if (!currentInput.includes('.')) {
        currentInput += '.';
      }
      updateDisplay();
    }

    function clearAll() {
      playHapticSound('clear');
      currentInput = '0';
      equation = '';
      resetOnNextNumber = false;
      updateDisplay();
    }

    function deleteLast() {
      playHapticSound('backspace');
      if (currentInput === 'Error' || resetOnNextNumber) {
        currentInput = '0';
        resetOnNextNumber = false;
      } else {
        if (currentInput.length > 1) {
          currentInput = currentInput.slice(0, -1);
          if (currentInput === '-') currentInput = '0';
        } else {
          currentInput = '0';
        }
      }
      updateDisplay();
    }

    function handleOperator(op) {
      playHapticSound('operator');
      const opSymbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      const displaySymbol = opSymbols[op] || op;

      if (currentInput === 'Error') {
        currentInput = '0';
      }

      if (op === '%') {
        const val = parseFloat(currentInput);
        if (!isNaN(val)) {
          const res = val / 100;
          currentInput = String(res);
          equation = `${formatNumberString(String(val))}%`;
          resetOnNextNumber = true;
          updateDisplay(true);

          historyData.unshift({
            equation: `${formatNumberString(String(val))}% =`,
            result: formatNumberString(String(res)),
            time: "Just now"
          });
        }
        return;
      }

      if (equation && !resetOnNextNumber) {
        evaluateCalculation(false);
      }

      equation = `${formatNumberString(currentInput)} ${displaySymbol}`;
      resetOnNextNumber = true;
      updateDisplay();
    }

    function evaluateCalculation(isFinal = true) {
      if (!equation || equation.includes('=')) {
        if (isFinal) playHapticSound('equals');
        return;
      }

      const match = equation.match(/([−\-+×÷*\/])\s*$/);
      if (!match) return;

      const rawOp = match[1];
      const prevNumStr = equation.replace(match[0], '').replace(/,/g, '').trim();
      const prevNum = parseFloat(prevNumStr);
      const currentNum = parseFloat(currentInput.replace(/,/g, ''));

      if (isNaN(prevNum) || isNaN(currentNum)) return;

      let result = 0;
      let divByZero = false;

      switch (rawOp) {
        case '+':
          result = prevNum + currentNum;
          break;
        case '-':
        case '−':
          result = prevNum - currentNum;
          break;
        case '×':
        case '*':
          result = prevNum * currentNum;
          break;
        case '÷':
        case '/':
          if (currentNum === 0) divByZero = true;
          else result = prevNum / currentNum;
          break;
        default:
          return;
      }

      if (isFinal) {
        playHapticSound('equals');
      }

      if (divByZero) {
        equation = `${formatNumberString(String(prevNum))} ${rawOp} 0 =`;
        currentInput = 'Error';
        resetOnNextNumber = true;
        updateDisplay(true);
        return;
      }

      const precisionResult = parseFloat(result.toPrecision(12));
      const resultStr = String(precisionResult);

      if (isFinal) {
        const fullEquation = `${formatNumberString(String(prevNum))} ${rawOp} ${formatNumberString(String(currentNum))} =`;
        equation = fullEquation;
        currentInput = resultStr;
        resetOnNextNumber = true;
        updateDisplay(true);

        // Add to Calculation History dynamically
        historyData.unshift({
          equation: fullEquation,
          result: formatNumberString(resultStr),
          time: "Just now"
        });
        if (historyData.length > 20) historyData.pop();
        historyCountBadge.textContent = historyData.length;
        historyIndicator.classList.remove('hidden');
      } else {
        currentInput = resultStr;
      }
    }

    // -------------------------------------------------------------------------
    // 4. Attach Events to Calculator Keypad
    // -------------------------------------------------------------------------
    const buttons = document.querySelectorAll('button[data-key]');
    buttons.forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const key = btn.getAttribute('data-key');
        const type = btn.getAttribute('data-type');

        if (type === 'number') {
          inputDigit(key);
        } else if (type === 'decimal') {
          inputDecimal();
        } else if (type === 'clear') {
          clearAll();
        } else if (type === 'backspace') {
          deleteLast();
        } else if (type === 'operator') {
          handleOperator(key);
        } else if (type === 'equals') {
          evaluateCalculation(true);
        }
      });
    });

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      let key = e.key;
      let targetBtn = null;

      if (key >= '0' && key <= '9') {
        inputDigit(key);
        targetBtn = document.querySelector(`button[data-key="${key}"]`);
      } else if (key === '.') {
        inputDecimal();
        targetBtn = document.querySelector('button[data-key="."]');
      } else if (key === '+' || key === '-' || key === '*' || key === '/' || key === '%') {
        handleOperator(key);
        targetBtn = document.querySelector(`button[data-key="${key}"]`);
      } else if (key === 'Enter' || key === '=') {
        e.preventDefault();
        evaluateCalculation(true);
        targetBtn = document.querySelector('button[data-key="Enter"]');
      } else if (key === 'Backspace') {
        deleteLast();
        targetBtn = document.querySelector('button[data-key="Backspace"]');
      } else if (key === 'Escape' || key.toLowerCase() === 'c') {
        if (!historySheet.classList.contains('translate-y-full')) {
          closeHistorySheet();
        } else {
          clearAll();
          targetBtn = document.querySelector('button[data-key="AC"]');
        }
      }

      if (targetBtn) {
        targetBtn.classList.add('key-pressed');
        setTimeout(() => targetBtn.classList.remove('key-pressed'), 120);
      }
    });

    // Initial render
    renderHistory();
    updateDisplay();
  })();
</script>
</body></html>
